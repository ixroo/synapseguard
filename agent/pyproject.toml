[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse-agent"
version = "0.1.0"
description = "Verifiable Gemini AI risk reviewer and bidirectional Reactive Omni orchestrator for SynapseGuard"
requires-python = ">=3.11"
dependencies = [
    "eth-account>=0.13.0",
    "httpx>=0.27.0",
    "pydantic>=2.7.0",
    "web3>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
